    responses:
      -
        custom: []
        status: 200
        content: '{"name":"ViewsMax","summary":"Social posting + link tracking\/analytics SaaS. AI agents act on a user''s behalf: compose and schedule posts to YouTube, TikTok, X, LinkedIn, Threads, Instagram, and Bluesky; create offers and tracked links; read click, conversion, and revenue stats. User data is private \u2014 all access is authenticated.","site":"http:\/\/localhost:8080","docs":{"agents":"http:\/\/localhost:8080\/ai.md","llms_txt":"http:\/\/localhost:8080\/llms.txt","api_reference":"https:\/\/api.viewsmax.com\/docs","openapi":"https:\/\/api.viewsmax.com\/docs.openapi"},"mcp":{"endpoint":"https:\/\/api.viewsmax.com\/api\/mcp","transport":"streamable-http","auth":[{"type":"oauth2","grant":"authorization_code","pkce":true,"scopes":["mcp","mcp:read","mcp:write"],"authorization_server_metadata":"https:\/\/api.viewsmax.com\/.well-known\/oauth-authorization-server","protected_resource_metadata":"https:\/\/api.viewsmax.com\/.well-known\/oauth-protected-resource\/api\/mcp","dynamic_client_registration":true},{"type":"api_key","header":"Authorization: Bearer <key>","key_prefix":"vmx_","access_levels":["read","full"],"obtain_at":"http:\/\/localhost:8080\/dashboard\/settings"}],"tools":[{"name":"list_connected_accounts","description":"List the social accounts the user has connected (YouTube, TikTok, X, LinkedIn, Threads, Instagram, Beehiiv). Posts can only publish to connected platforms; use get_connect_url for anything missing. Beehiiv is connected via an API key on the Connections page, not get_connect_url, and is used for newsletter reach, not posting.","access":"read"},{"name":"upload_media","description":"Download a file from a URL and host it on ViewsMax storage for use in posts. Returns a media entry ({type, url, path}) to pass to create_post. Supports jpeg\/png\/webp\/gif images and mp4\/mov video.","access":"write"},{"name":"create_post","description":"Compose a social post for one or more platforms (tiktok, youtube, x, linkedin, threads, instagram). status \"draft\" (default) saves without publishing, \"posted\" publishes immediately, \"scheduled\" publishes at scheduled_at. TikTok requires a video media entry with a url; YouTube requires a video with a path \u2014 both come from upload_media. Instagram needs an image or video url. Caption character limits: tiktok: 2200, youtube: 5000, x: 280, linkedin: 3000, threads: 500, instagram: 2200. Publishing is asynchronous: check per-platform results with get_post.","access":"write"},{"name":"list_posts","description":"List the user''s posts, newest first, with per-platform publish status. Filter by status (draft, scheduled, posted) and\/or a scheduled_at date window (from\/to, ISO-8601). Returns at most `limit` posts (default 25).","access":"read"},{"name":"get_post","description":"Fetch one post by id, including each platform target''s publish status (pending, publishing, published, failed) and error message.","access":"read"},{"name":"update_post","description":"Edit a draft or scheduled post: caption, media, platforms, schedule, or status. Setting status to \"posted\" publishes immediately. Posts that have already been published cannot be edited. Caption character limits: tiktok: 2200, youtube: 5000, x: 280, linkedin: 3000, threads: 500, instagram: 2200.","access":"write"},{"name":"delete_post","description":"Delete a post and its platform targets. Does not remove content already published to the platforms.","access":"write"},{"name":"list_offers","description":"List the user''s offers (tracked promotions) with their tracking links, goals, and per-offer click\/conversion stats. Optional from\/to date filter.","access":"read"},{"name":"create_offer","description":"Create an offer (a promotion to track). Requires offer_url; optional name and goals (conversion events with a conversion_url and value). Subject to the user''s plan offer limit.","access":"write"},{"name":"get_offer","description":"Fetch one offer by id, with its tracking links and goals.","access":"read"},{"name":"update_offer","description":"Update an offer''s name, offer_url, goals, or links.","access":"write"},{"name":"delete_offer","description":"Delete an offer and stop tracking it.","access":"write"},{"name":"create_tracking_link","description":"Create a tracking link for an offer, to place in a video description, email, social bio, etc. Placement is one of: video, email, x, linkedin, podcast, blog, website, tiktok, ad, instagram, beehiiv, other \u2014 attaching a youtube_video_id or beehiiv_post_id auto-sets the matching placement.","access":"write"},{"name":"get_offer_stats","description":"Aggregated analytics across the user''s offers: video views, clicks, calls booked, email signups, and sales revenue. Optional from\/to window.","access":"read"},{"name":"get_stats_timeseries","description":"Daily time-series of clicks and attributed revenue (one bucket per day, gaps zero-filled). Defaults to the last 28 days; filter with from\/to and optionally a single offer via event_id.","access":"read"},{"name":"disconnect_account","description":"Disconnect a social account by platform (e.g. x, youtube, tiktok). Fully disconnects it \u2014 nothing is left half-connected \u2014 and any pending posts targeting that platform will fail to publish.","access":"write"},{"name":"get_connect_url","description":"Get the URL of the ViewsMax Connections page where the user can connect a social platform. The user must open the page in a browser and click Connect there \u2014 the OAuth approval happens on that page and cannot be completed inside this conversation.","access":"write"},{"name":"create_feature_request","description":"Submit a feature request to the ViewsMax team on the user''s behalf.","access":"write"}]},"rest":{"base_url":"https:\/\/api.viewsmax.com\/api","auth":"Same vmx_ API key as a Bearer token (posts, offers, tracking, stats endpoints only; read-only keys are limited to GET).","openapi":"https:\/\/api.viewsmax.com\/docs.openapi"},"rate_limits":{"mcp_requests_per_minute":120,"create_post_per_hour":180,"upload_media_per_hour":40}}'
        headers:
