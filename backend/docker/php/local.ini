; PHP Configuration for AI Model Image Uploads + post video uploads
; Increase upload limits to handle large image and video files

; Maximum size of POST data that PHP will accept. Kept above
; upload_max_filesize to leave headroom for the other multipart fields.
post_max_size = 520M

; Maximum allowed size for uploaded files (matches the 512MB video cap
; enforced by the post media upload validation on the app side).
upload_max_filesize = 512M

; Maximum number of files that can be uploaded via a single request
max_file_uploads = 20

; Maximum amount of memory a script may consume
memory_limit = 512M

; Maximum execution time of each script, in seconds
max_execution_time = 300

; Maximum time in seconds a script is allowed to parse input data
max_input_time = 300

; Maximum number of input variables
max_input_vars = 3000

; Maximum depth of nesting arrays
max_input_nesting_level = 64
