name: Deploy React Site to S3

on:
  workflow_dispatch:   # keep the manual trigger as an escape hatch
  push:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend   # all `run` steps execute here

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json   # cache key must point at the subfolder

    - name: Install Dependencies
      run: npm ci

    - name: Run Tests
      run: npm run test:run

    - name: Build Project
      run: npm run build
      env:
        VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        VITE_TIKTOK_CLIENT_KEY: ${{ secrets.VITE_TIKTOK_CLIENT_KEY }}
        VITE_INSTAGRAM_CLIENT_ID: ${{ secrets.VITE_INSTAGRAM_CLIENT_ID }}
        VITE_PAYPAL_CLIENT_ID: ${{ secrets.VITE_PAYPAL_CLIENT_ID }}
        VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
        VITE_USE_MOCK_API: 'false'
        # Analytics / pixels — optional; blank disables that tracker (see frontend/.env.example)
        VITE_TRACKING_HOSTNAME: ${{ secrets.VITE_TRACKING_HOSTNAME }}
        VITE_META_PIXEL_ID: ${{ secrets.VITE_META_PIXEL_ID }}
        VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
        VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        VITE_CLARITY_ID: ${{ secrets.VITE_CLARITY_ID }}
        VITE_REWARDFUL_ID: ${{ secrets.VITE_REWARDFUL_ID }}
        VITE_VIEWSMAX_TRACKER_USER: ${{ secrets.VITE_VIEWSMAX_TRACKER_USER }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-1

    - name: Deploy to S3 Bucket
      run: |
        aws s3 sync ./dist/assets s3://${{ secrets.AWS_S3_BUCKET_NAME }}/assets --delete \
          --cache-control "public,max-age=31536000,immutable"
        aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET_NAME }} --delete --exclude "assets/*" \
          --cache-control "no-cache"

    - name: Invalidate CloudFront Cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"
