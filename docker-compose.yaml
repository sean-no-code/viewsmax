# One-command local setup: `docker compose up`
#
# Services:
#   postgres  — both databases (viewsmax + viewsmax_search, see backend/docker/postgres/init.sql)
#   app       — the Laravel API on http://localhost:8000
#   queue     — background jobs (publishing, uploads, AI generation)
#   scheduler — due scheduled posts, every minute
#   frontend  — the Vite dev server on http://localhost:8080

name: viewsmax

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  # Deliberately NOT setting DB_* / QUEUE_CONNECTION here.
  #
  # Laravel resolves env() through $_SERVER before PHPUnit's <env force="true">
  # overrides, so exporting them into the container makes the test suite connect
  # to this live Postgres instead of the in-memory sqlite phpunit.xml asks for —
  # `docker compose exec app php artisan test` fails en masse.
  #
  # docker/entrypoint.sh writes the same values into .env on first run, which is
  # what the application reads. Change them there, or in backend/.env.
  environment: &backend-env
    DB_HOST: postgres
    CORS_ALLOWED_ORIGINS: http://localhost:8080
  volumes:
    # Live code editing. This hides the image's vendor/, which is why the named
    # volume below exists — Docker seeds an empty named volume from the image,
    # so vendor/ survives the bind mount without a slow install on every boot.
    - ./backend:/var/www/html
    - backend_vendor:/var/www/html/vendor
    - backend_storage:/var/www/html/storage
    # Compiled Blade assets. Built into the image but gitignored, so without
    # this the bind mount hides them and `/` fails with "Vite manifest not found".
    - backend_public_build:/var/www/html/public/build
  depends_on:
    postgres:
      condition: service_healthy
  networks: [viewsmax]

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: viewsmax_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: viewsmax
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Nothing should connect until postgres is genuinely accepting queries.
      test: ["CMD-SHELL", "pg_isready -U postgres -d viewsmax"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks: [viewsmax]

  app:
    <<: *backend
    container_name: viewsmax_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    entrypoint: ["bash", "/var/www/html/docker/entrypoint.sh"]
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

  queue:
    <<: *backend
    container_name: viewsmax_queue
    restart: unless-stopped
    # Waits for `app` so migrations have run before jobs are picked up.
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    command: ["php", "artisan", "queue:work", "database", "--sleep=3", "--tries=3", "--timeout=300", "--memory=512"]

  scheduler:
    <<: *backend
    container_name: viewsmax_scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    command: ["php", "artisan", "schedule:work"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: viewsmax_frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Host only — the frontend appends "/api/..." itself. Including /api here
      # produces requests to /api/api/... which 404.
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      # Same trick as vendor/: keep the image's node_modules from being hidden.
      - frontend_node_modules:/app/node_modules
    depends_on:
      - app
    networks: [viewsmax]

volumes:
  postgres_data:
  backend_vendor:
  backend_storage:
  backend_public_build:
  frontend_node_modules:

networks:
  viewsmax:
    driver: bridge
