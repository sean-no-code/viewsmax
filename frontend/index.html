<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Charset must be declared within the first 1024 bytes of the document
       (browsers stop sniffing after that), so it stays above every script. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Analytics / pixels are NOT inlined here. They load from src/lib/tracking.ts,
       driven by VITE_* env vars (see .env.example), and only on the configured
       production hostname — so this open-source tree ships with no tracking IDs. -->

  <title>ViewsMax — Generate More Leads From Your Content</title>
  <meta name="description" content="ViewsMax helps creators and marketers generate more leads from their content" />
  <meta name="author" content="ViewsMax" />

  <meta property="og:title" content="ViewsMax — Generate More Leads From Your Content" />
  <meta property="og:site_name" content="ViewsMax" />
  <meta property="og:description"
    content="ViewsMax helps creators and marketers generate more leads from their content" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://viewsmax.com/" />
  <meta property="og:image" content="https://viewsmax.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"
    content="Make Content That Makes Sales — ViewsMax shows you exactly which posts and platforms drive real sales" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ViewsMax — Generate More Leads From Your Content" />
  <meta name="twitter:description"
    content="ViewsMax helps creators and marketers generate more leads from their content" />
  <meta name="twitter:image" content="https://viewsmax.com/og-image.png" />

  <!-- Favicons / app icons (ViewsMax mark) -->
  <!-- SVG first and scalable so Chrome prefers it; the .ico is a fixed-size
       fallback (sizes="any" on the .ico made Chrome pick it over the SVG).
       ?v=2 busts Chrome's separate favicon cache after the icon redesign. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" sizes="any" />
  <link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#FF1F3D" />

  <!-- Google Fonts - Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Structured data for search engines & AI assistants (agent docs: /llms.txt, /ai.md) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "ViewsMax",
    "url": "https://viewsmax.com/",
    "description": "Social posting and sales tracking for creators and marketers. Schedule posts to YouTube, TikTok, X, LinkedIn, Threads, Instagram, and Bluesky, and see which content drives clicks, conversions, and revenue. Includes an MCP server and REST API for AI agents (see https://viewsmax.com/ai.md).",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "offers": [
      { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "USD" },
      { "@type": "Offer", "name": "Starter", "price": "29.00", "priceCurrency": "USD" },
      { "@type": "Offer", "name": "Creator", "price": "59.00", "priceCurrency": "USD" },
      { "@type": "Offer", "name": "Pro", "price": "99.00", "priceCurrency": "USD" },
      { "@type": "Offer", "name": "Agency", "price": "149.00", "priceCurrency": "USD" }
    ]
  }
  </script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
